# freebsd-config pf(4) — desktop firewall (FreeBSD 15.1).
# Installed to /etc/pf.conf by install.sh (existing file is backed up first).
# Policy: trust loopback, allow all outbound, allow return traffic for
# established sessions, block everything inbound. Inbound ports (e.g. KDE
# Connect, Syncthing) should be opened explicitly per host — see README.
set skip on lo0
block in all
pass out all keep state
pass in on lo0 all
# Return traffic for outbound connections (redundant with keep state, kept
# explicit so `pfctl -sr` reads clearly on a fresh install).
pass in proto tcp from any to any port > 1023 flags S/SA keep state
pass in proto udp from any to any port > 1023 keep state
